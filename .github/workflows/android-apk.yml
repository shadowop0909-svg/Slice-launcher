
name: Slice Launcher Android APK

on:
  push:
    paths:
      - "SliceLauncher-source-upload.zip"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      CURSEFORGE_API_KEY: DUMMY

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK tools
        run: sdkmanager "platform-tools"

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Slice Launcher source
        run: |
          mkdir -p source
          unzip -q SliceLauncher-source-upload.zip -d source
          chmod +x source/SliceLauncher/gradlew

      - name: Fix JitPack dependency
        working-directory: source/SliceLauncher
        run: |
          sed -i 's/com.github.SliceLauncher:alsoft-android-aar/com.github.MojoLauncher:alsoft-android-aar/' app_slice/build.gradle

      - name: Fix duplicate Android resource
        working-directory: source/SliceLauncher
        run: |
          sed -i '/<color name="mineknob_track_tint">.*<\/color>/d' app_slice/src/main/res/values/colors.xml

      - name: Fetch source submodules
        working-directory: source/SliceLauncher
        run: |
          git clone --depth 1 --branch glfw34 https://github.com/MojoLauncher/glfw.git glfw
          git clone --depth 1 --branch master https://github.com/MojoLauncher/mojoexec.git mojoexec
          git clone --depth 1 --branch main https://github.com/MojoLauncher/MojoSDL.git sdl
          git clone --depth 1 --branch master https://github.com/MojoLauncher/NoBlocklist.git NoBlocklist

      - name: Fix MojoExec package imports
        working-directory: source/SliceLauncher
        run: |
          test -f mojoexec/jni_bindings/src/main/java/git/artdeell/mojoexec/MojoExec.java

          grep -RIl --include='*.java' 'com.slice.launcherexec' app_slice/src/main/java | xargs -r sed -i 's/com\.slice\.launcherexec/git.artdeell.mojoexec/g'

          if grep -RIn --include='*.java' 'com.slice.launcherexec' app_slice/src/main/java; then
            echo "Old MojoExec package reference remains"
            exit 1
          fi

          grep -RIn --include='*.java' 'git.artdeell.mojoexec.MojoExec' app_slice/src/main/java

      - name: Migrate legacy Turnip call to current MojoExec API
        working-directory: source/SliceLauncher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app_slice/src/main/java/com/slice/launcher/game/renderer/GameRenderer.java")
          source = path.read_text()

          old = "MojoExec.setUseTurnip(true);"
          new = 'MojoExec.configureCustomVulkanDriver("libvulkan_freedreno.so", null);'

          count = source.count(old)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one legacy Turnip call, found {count}"
              )

          path.write_text(source.replace(old, new))
          PY

          grep -n 'configureCustomVulkanDriver' app_slice/src/main/java/com/slice/launcher/game/renderer/GameRenderer.java

          grep -q 'configureCustomVulkanDriver(String libraryName, String librarySearchPath)' mojoexec/jni_bindings/src/main/java/git/artdeell/mojoexec/MojoExec.java

      - name: Download optional LTW dependency
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: source/SliceLauncher/app_slice/libs

      - name: Download optional Mesa dependency
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: source/SliceLauncher/app_slice/libs

      - name: Build debug APKs
        working-directory: source/SliceLauncher
        run: |
          ./gradlew --no-daemon :app_slice:assembleFullDebug :app_slice:assembleNoruntimeDebug

      - name: Upload full-runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: SliceLauncher-full-debug
          path: source/SliceLauncher/app_slice/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload no-runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: SliceLauncher-no-runtime-debug
          path: source/SliceLauncher/app_slice/build/outputs/apk/noruntime/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
