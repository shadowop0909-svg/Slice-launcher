name: Slice Launcher Android APK

on:
  push:
    paths:
      - "SliceLauncher-source-upload.zip"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CURSEFORGE_API_KEY: DUMMY

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        run: sdkmanager "platform-tools"
      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Slice Launcher source
        run: |
          test -f SliceLauncher-source-upload.zip
          mkdir -p source
          unzip -q SliceLauncher-source-upload.zip -d source
          test -f source/SliceLauncher/gradlew
          chmod +x source/SliceLauncher/gradlew

      - name: Fetch source submodules
        working-directory: source/SliceLauncher
        run: |
          git clone --depth 1 --branch glfw34 https://github.com/MojoLauncher/glfw.git glfw
          git clone --depth 1 --branch master https://github.com/MojoLauncher/mojoexec.git mojoexec
          git clone --depth 1 --branch main https://github.com/MojoLauncher/MojoSDL.git sdl
          git clone --depth 1 --branch master https://github.com/MojoLauncher/NoBlocklist.git NoBlocklist

      - name: Download optional LTW dependency
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: source/SliceLauncher/app_slice/libs

      - name: Download optional Mesa dependency
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: source/SliceLauncher/app_slice/libs

      - name: Build debug APKs
        working-directory: source/SliceLauncher
        run: |
          ./gradlew --no-daemon :app_slice:assembleFullDebug :app_slice:assembleNoruntimeDebug

      - name: Upload full-runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: SliceLauncher-full-debug
          path: source/SliceLauncher/app_slice/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload no-runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: SliceLauncher-no-runtime-debug
          path: source/SliceLauncher/app_slice/build/outputs/apk/noruntime/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
